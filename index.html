    function generateCode() { 
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; 
      var code = ''; 
      for (var i = 0; i < 6; i++) { code += chars.charAt(Math.floor(Math.random() * chars.length)); } 
      return code; 
    }

    function calculateType(answers) {
      var E = 0, I = 0, S = 0, N = 0, T = 0, F = 0, J = 0, P = 0;
      answers.forEach(function(a, idx) {
        var q = freeQuestions[idx] || deepQuestions[idx - 7];
        if (!q) return;
        var axis = q.axis;
        if (axis === 'EI') { a === 'A' ? E++ : I++; }
        if (axis === 'SN') { a === 'A' ? S++ : N++; }
        if (axis === 'TF') { a === 'A' ? T++ : F++; }
        if (axis === 'JP') { a === 'A' ? J++ : P++; }
      });
      return (E >= I ? 'E' : 'I') + (S >= N ? 'S' : 'N') + (T >= F ? 'T' : 'F') + (J >= P ? 'J' : 'P');
    }

    function calculateCompatibility(type1, type2, answers1, answers2) {
      var bed1 = bedDetails[type1];
      var bed2 = bedDetails[type2];
      
      // 침대 궁합 점수
      var bedScore = compatibilityMatrix[bed1.category][bed2.category];
      
      // 답변 유사도 점수
      var answerScore = 0;
      var minLen = Math.min(answers1.length, answers2.length);
      for (var i = 0; i < minLen; i++) {
        if (answers1[i] === answers2[i]) answerScore += 5;
        else answerScore += 2;
      }
      var answerPct = minLen > 0 ? Math.round((answerScore / (minLen * 5)) * 100) : 70;
      
      // 종합 점수
      var totalScore = Math.round((bedScore * 0.4) + (answerPct * 0.6));
      
      return {
        total: Math.min(99, Math.max(60, totalScore)),
        bed: bedScore,
        values: answerPct
      };
    }

    function getCompatibilityAdvice(type1, type2) {
      var strengths = [];
      var cautions = [];
      
      // 강점 분석
      if (type1[0] !== type2[0]) strengths.push('서로 다른 에너지로 균형을 맞춰요');
      else if (type1[0] === 'E') strengths.push('함께 활동적인 시간을 즐겨요');
      else strengths.push('둘만의 조용한 시간을 소중히 해요');
      
      if (type1[2] === type2[2]) strengths.push('갈등 해결 방식이 비슷해요');
      else strengths.push('서로 다른 관점으로 성장할 수 있어요');
      
      if (type1[3] === type2[3]) strengths.push('생활 패턴이 잘 맞아요');
      
      // 주의점 분석
      if (type1[0] !== type2[0]) cautions.push('혼자만의 시간 vs 함께하는 시간 조율 필요');
      if (type1[1] !== type2[1]) cautions.push('미래 계획에 대한 대화가 필요해요');
      if (type1[2] !== type2[2]) cautions.push('감정 vs 논리, 서로의 방식 존중하기');
      if (type1[3] !== type2[3]) cautions.push('계획 vs 즉흥, 중간점 찾기');
      
      return { strengths: strengths.slice(0, 3), cautions: cautions.slice(0, 3) };
    }

    // ============================================
    // 이벤트 핸들러
    // ============================================
    function goToNickname() { state.page = 'nickname'; render(); }
    
    function startTest() { 
      var input = document.getElementById('nicknameInput'); 
      if (input && input.value.trim()) { 
        state.nickname = input.value.trim(); 
        state.page = 'test'; 
        render(); 
      } 
    }
    
    function selectAnswer(choice) { 
      state.answers.push(choice); 
      if (state.currentQ < freeQuestions.length - 1) { 
        state.currentQ++; 
        render(); 
      } else { 
        state.page = 'loading'; 
        render(); 
        setTimeout(async function() { 
          state.typeCode = calculateType(state.answers); 
          state.result = animalTypes[state.typeCode]; 
          await saveTestResult();
          
          // 초대 모드면 궁합 결과로
          if (state.isInviteMode && state.partnerData) {
            await completeCompatibility();
            showConfetti();
            state.page = 'compatibility_result';
          } else {
            state.page = 'result';
          }
          render(); 
        }, 2500); 
      } 
    }
    
    function startDeepTest() { 
      if (state.deepUsed) { alert('이미 완료했어요!'); return; } 
      state.currentQ = 0; 
      state.deepAnswers = []; 
      state.page = 'deep_test'; 
      render(); 
    }
    
    function selectDeepAnswer(choice) { 
      state.deepAnswers.push(choice); 
      if (state.currentQ < deepQuestions.length - 1) { 
        state.currentQ++; 
        render(); 
      } else { 
        state.deepUsed = true; 
        state.showDeepResult = true; 
        try { localStorage.setItem('love_animal_deep_used', 'true'); } catch(e) {} 
        updateDeepAnswers(); 
        showConfetti(); 
        state.page = 'result'; 
        render(); 
      } 
    }
    
    function markAsShared() { 
      state.hasShared = true; 
      try { localStorage.setItem('love_animal_shared', 'true'); } catch(e) {} 
      showConfetti(); 
      render(); 
    }
    
    // 결제 페이지로 이동
    function goToPayment(type) {
      var url = LATPEED_URLS[type];
      if (url && !url.includes('_HERE')) {
        window.location.href = url;
      } else {
        // 테스트용: URL 없으면 바로 처리
        if (type === 'premium' || type === 'bundle') {
          state.isPremium = true;
        }
        if (type === 'compatibility' || type === 'bundle') {
          createInviteSession().then(function() {
            state.page = 'create_invite';
            render();
          });
          return;
        }
        render();
      }
    }
    
    function goToResult() {
      state.page = 'result';
      render();
    }
    
    // 초대 링크 복사
    function copyInviteLink(url) {
      try { navigator.clipboard.writeText(url); } catch(e) {}
      alert('링크가 복사되었어요! 💕\n연인에게 공유해주세요!');
    }
    
    function shareInviteKakao(url) {
      var text = state.nickname + '님이 커플 궁합 테스트를 보냈어요! 💕\n\n우리의 연애 궁합은 몇 점일까?\n\n';
      if (navigator.share) {
        navigator.share({ title: '커플 궁합 테스트', text: text, url: url }).catch(function() {});
      } else {
        copyInviteLink(url);
      }
    }

      window.location.href = 'sms:?body=' + encodeURIComponent(text);

    function shareKakao() { 
      var text = '나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '!\n\n' + state.result.shortDesc + '\n\n나도 테스트하기 👉'; 
      if (navigator.share) {

      } else { copyLink(); }

      var text = '나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '! #연애동물테스트';

    function shareCompatResult() {
      var me = animalTypes[state.typeCode];
      var partner = animalTypes[state.partnerData.typeCode];
      var compat = calculateCompatibility(state.typeCode, state.partnerData.typeCode, state.answers, state.partnerData.answers);
      var text = '💕 ' + state.nickname + ' × ' + state.partnerData.nickname + ' 궁합 ' + compat.total + '점!\n\n' + me.emoji + ' ' + me.name + ' × ' + partner.emoji + ' ' + partner.name + '\n\n나도 테스트하기 👉';
      if (navigator.share) {
        navigator.share({ title: '커플 궁합 테스트', text: text, url: window.location.origin + window.location.pathname }).catch(function() {});
      } else {
        try { navigator.clipboard.writeText(text + ' ' + window.location.origin + window.location.pathname); } catch(e) {}
        alert('링크가 복사되었어요!');
      }
    }
    
    function restart() { 
      try {
        localStorage.removeItem('love_animal_nickname');
        localStorage.removeItem('love_animal_typeCode');
        localStorage.removeItem('love_animal_answers');
      } catch(e) {}
      state = { page: 'landing', nickname: '', currentQ: 0, answers: [], deepAnswers: [], result: null, typeCode: null, sessionId: null, shareCode: null, testCount: state.testCount, hasShared: state.hasShared, deepUsed: state.deepUsed, showDeepResult: false, isPremium: false, isInviteMode: false, inviteCode: null, myInviteCode: null, partnerData: null, showCompatibility: false }; 
      window.history.replaceState({}, document.title, window.location.pathname);
      render(); 
    }

    // 초기화
    (async function init() { 
      try { await getTestCount(); } catch(e) {} 
      render(); 
    })();
  </script>
</body>
</html>
