        var shareSection = !state.showDeepResult ? '<div class="bg-gradient-to-r from-green-400 to-blue-500 rounded-2xl p-5 mb-4 text-white"><div class="text-center mb-4"><p class="text-lg font-bold mb-1">🎁 공유하면 심층 14문제 무료!</p><p class="text-sm opacity-90">친구에게 공유하고 나의 숨겨진 연애 DNA 알아보기</p></div>' + (!state.hasShared ? '<div class="flex justify-center gap-3 mb-4"><button onclick="shareKakao()" class="share-btn w-14 h-14 bg-yellow-400 rounded-2xl flex items-center justify-center text-2xl shadow-lg">💬</button><button onclick="shareInstagram()" class="share-btn w-14 h-14 bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg">📸</button><button onclick="shareTwitter()" class="share-btn w-14 h-14 bg-black rounded-2xl flex items-center justify-center text-2xl shadow-lg">𝕏</button><button onclick="copyLink()" class="share-btn w-14 h-14 bg-white text-gray-700 rounded-2xl flex items-center justify-center text-2xl shadow-lg">🔗</button></div><p class="text-center text-xs opacity-80">아무 방법으로나 공유하면 즉시 활성화!</p>' : (!state.deepUsed ? '<button onclick="startDeepTest()" class="w-full py-4 bg-white text-green-600 font-bold rounded-xl text-lg shadow-lg hover:shadow-xl transition">🎁 심층 14문제 무료로 시작하기</button>' : '<div class="text-center py-3 bg-white/20 rounded-xl"><p class="font-medium">✅ 이미 무료 심층을 받으셨어요!</p></div>')) + '</div>' : '';
        var shareCodeHtml = state.shareCode ? '<div class="mt-6 p-4 bg-gray-50 rounded-xl text-center"><p class="text-xs text-gray-400 mb-1">내 결과 코드</p><p class="text-lg font-bold text-purple-600">' + state.shareCode + '</p></div>' : '';
        
        app.innerHTML = '<div class="min-h-screen py-8 px-4 sm:px-6"><div class="max-w-md mx-auto"><div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6 fade-in-up"><div class="py-8 px-6 text-center" style="background: linear-gradient(135deg, ' + r.color + '40, ' + r.color + '20)"><p class="text-gray-600 mb-2">' + state.nickname + '님의 연애 동물은</p><div class="text-7xl sm:text-8xl my-4">' + r.emoji + '</div><h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">' + r.name + '</h2><p class="text-gray-600 text-sm px-4">' + r.shortDesc + '</p></div><div class="px-6 py-6"><p class="text-sm font-medium text-gray-500 mb-4">📊 나의 연애 DNA</p><div class="grid grid-cols-7 gap-2 mb-5">' + traitsHtml + '</div><div class="space-y-3">' + topTraitsHtml + '</div></div>' + deepSection + '<div class="px-6 pb-6"><div class="relative bg-gradient-to-r from-purple-50 to-pink-50 rounded-2xl p-5"><p class="text-sm font-medium text-purple-600 mb-3">🔥 침대 위 나의 성향</p><div class="blur-teaser space-y-2 text-sm text-gray-600"><p>⭐⭐⭐⭐⭐ ' + r.bedTeaser.split('|')[0] + '</p><p>⭐⭐⭐⭐ ' + r.bedTeaser.split('|')[1] + '</p><p>⭐⭐⭐ ' + r.bedTeaser.split('|')[2] + '</p></div><div class="lock-overlay"><span class="text-3xl">🔒</span><p class="text-sm text-gray-600 font-medium">프리미엄에서 확인</p></div></div></div></div>' + shareSection + '<button onclick="shareResult()" class="w-full py-4 bg-white border border-gray-200 text-gray-700 font-medium rounded-2xl mb-4 hover:bg-gray-50 transition flex items-center justify-center gap-2"><span>📱</span> 결과 공유하기</button><div class="space-y-3"><button onclick="openPayment(\'premium\')" class="w-full py-5 gradient-bg text-white font-semibold rounded-2xl shadow-lg hover:shadow-xl transition"><div class="flex flex-col items-center"><span class="text-lg mb-1">🔓 나 완벽판 분석</span><span class="text-sm opacity-90">21문제 심층 + 침대 성향 상세</span><span class="font-bold mt-1">3,000원</span></div></button><button onclick="openPayment(\'compatibility\')" class="w-full py-5 bg-white border-2 border-purple-300 text-purple-600 font-semibold rounded-2xl hover:border-purple-400 hover:bg-purple-50 transition"><div class="flex flex-col items-center"><span class="text-lg mb-1">💕 연인과 궁합 분석</span><span class="text-sm text-gray-500">연애 + 침대 호환성 완벽 분석</span><span class="font-bold mt-1">3,000원</span></div></button><button onclick="openPayment(\'bundle\')" class="w-full py-5 gradient-bg-gold text-white font-bold rounded-2xl shadow-lg hover:shadow-xl transition relative overflow-hidden"><span class="absolute top-0 right-0 bg-white text-yellow-600 text-xs px-3 py-1 rounded-bl-xl font-bold">BEST</span><div class="flex flex-col items-center"><span class="text-lg mb-1">💝 완벽판 + 궁합 번들</span><span class="text-sm opacity-90">둘 다 한번에!</span><div class="flex items-center gap-2 mt-1"><span class="line-through opacity-70">6,000원</span><span class="font-bold text-lg">5,000원</span></div></div></button></div>' + shareCodeHtml + '<button onclick="restart()" class="w-full mt-6 py-3 text-gray-400 hover:text-gray-600 transition">처음부터 다시하기</button></div></div>';
      }
    }

    function goToNickname() { state.page = 'nickname'; render(); }
    function startTest() { var input = document.getElementById('nicknameInput'); if (input && input.value.trim()) { state.nickname = input.value.trim(); state.page = 'test'; render(); } }
    function selectAnswer(choice) { state.answers.push(choice); if (state.currentQ < freeQuestions.length - 1) { state.currentQ++; render(); } else { state.page = 'loading'; render(); setTimeout(async function() { state.typeCode = calculateType(state.answers); state.result = animalTypes[state.typeCode]; await saveTestResult(); state.page = 'result'; render(); }, 2500); } }
    function startDeepTest() { if (state.deepUsed) { alert('이미 무료 심층 분석을 받으셨어요!'); return; } state.currentQ = 0; state.deepAnswers = []; state.page = 'deep_test'; render(); }
    function selectDeepAnswer(choice) { state.deepAnswers.push(choice); if (state.currentQ < deepQuestions.length - 1) { state.currentQ++; render(); } else { state.deepUsed = true; state.showDeepResult = true; try { localStorage.setItem('love_animal_deep_used', 'true'); } catch(e) {} updateDeepAnswers(); showConfetti(); state.page = 'result'; render(); } }
    function markAsShared() { state.hasShared = true; try { localStorage.setItem('love_animal_shared', 'true'); } catch(e) {} showConfetti(); render(); }
    function shareKakao() { var text = '나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '!\n\n' + state.result.shortDesc + '\n\n나도 테스트하기 👉'; if (navigator.share) { navigator.share({ title: '연애 동물 테스트', text: text, url: window.location.href }).then(function() { markAsShared(); }).catch(function() {}); } else { copyLink(); } }
    function shareInstagram() { var text = '나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '! #연애동물테스트'; try { navigator.clipboard.writeText(text + '\n' + window.location.href); } catch(e) {} alert('텍스트가 복사되었어요!\n인스타그램 스토리에 붙여넣기 하세요 📸'); markAsShared(); }
    function shareTwitter() { var text = encodeURIComponent('나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '!\n\n' + state.result.shortDesc + '\n\n'); var url = encodeURIComponent(window.location.href); window.open('https://twitter.com/intent/tweet?text=' + text + '&url=' + url, '_blank'); markAsShared(); }
    function copyLink() { var shareUrl = state.shareCode ? window.location.origin + window.location.pathname + '?code=' + state.shareCode : window.location.href; try { navigator.clipboard.writeText(shareUrl); } catch(e) {} alert('링크가 복사되었어요! 🔗\n친구에게 공유해보세요!'); markAsShared(); }
    function shareResult() { var shareUrl = state.shareCode ? window.location.origin + window.location.pathname + '?code=' + state.shareCode : window.location.href; var text = '나의 연애 동물은 ' + state.result.emoji + ' ' + state.result.name + '!\n\n' + state.result.shortDesc + '\n\n나도 테스트하기 👉'; if (navigator.share) { navigator.share({ title: '연애 동물 테스트', text: text, url: shareUrl }).catch(function() {}); } else { try { navigator.clipboard.writeText(text + ' ' + shareUrl); } catch(e) {} alert('링크가 복사되었어요!'); } }
    function openPayment(type) { var products = { premium: { name: '나 완벽판', price: 3000 }, compatibility: { name: '궁합 분석', price: 3000 }, bundle: { name: '완벽판+궁합 번들', price: 5000 } }; alert(products[type].name + ' 결제 페이지로 이동합니다.\n금액: ' + products[type].price.toLocaleString() + '원\n\n(Latpeed 결제 연동 예정)'); }
    function restart() { state = { page: 'landing', nickname: '', currentQ: 0, answers: [], deepAnswers: [], result: null, typeCode: null, sessionId: null, shareCode: null, testCount: state.testCount, hasShared: state.hasShared, deepUsed: state.deepUsed, showDeepResult: false }; render(); }

    (async function init() { try { await getTestCount(); } catch(e) {} render(); })();
  </script>
</body>
</html>
