    // 동물 계산
    function calculateAnimal(answers) {
      var scores = { attach: 0, devote: 0, comm: 0, conflict: 0, life: 0, love: 0, intimate: 0 };
      var allQ = freeQuestions.concat(premiumQuestions);
      
      answers.forEach(function(a, i) {
        var q = allQ[i];
        if (!q) return;
        if (a === 'A') scores[q.axis] = (scores[q.axis] || 0) + 1;
        else scores[q.axis] = (scores[q.axis] || 0) - 0.5; // B 선택 시 감점
      });

      var total = scores.attach + scores.devote + scores.comm + scores.life + scores.intimate;
      
      // ===== 신규 4종 (현실 계열) 먼저 체크 =====
      // 🐍 뱀: 심리 지배, 가스라이팅 (comm 높음 + conflict 높음 + devote 낮음)
      if (scores.comm >= 3 && scores.conflict >= 2 && scores.devote <= 1) return 'snake';
      
      // 🐟 미꾸라지: 갈등 회피, 잠수 (conflict 매우 낮음 + comm 낮음)
      if (scores.conflict <= -1 && scores.comm <= 0 && scores.attach <= 1) return 'fish';
      
      // 🦊 여우: 플러팅, 어장관리 (intimate 높음 + attach 낮음 + comm 높음)
      if (scores.intimate >= 3 && scores.attach <= 1 && scores.comm >= 2) return 'fox';
      
      // 🐱 고양이: 츤데레, 독립적 (attach 낮음 + devote 중간 + comm 낮음)
      if (scores.attach <= 1 && scores.comm <= 1 && scores.devote >= 1) return 'cat';
      
      // ===== 기존 8종 =====
      // 🐺 늑대: 헌신적, 보호본능
      if (scores.devote >= 3 && scores.comm >= 2) return 'wolf';
      
      // 🐬 돌고래: 자유로움, 활발
      if (scores.life >= 4 && scores.intimate >= 3) return 'dolphin';
      
      // 🐼 판다: 평화로움, 힐링
      if (scores.comm <= 1 && scores.conflict <= 1 && scores.attach >= 1) return 'panda';
      
      // 🦁 사자: 리더십, 자신감
      if (scores.comm >= 3 && scores.devote >= 2) return 'lion';
      
      // 🦉 올빼미: 신중함, 분석적
      if (scores.attach <= 2 && scores.comm <= 2 && scores.intimate <= 1) return 'owl';
      
      // 🦦 수달: 유쾌함, 장난기
      if (scores.intimate >= 2 && scores.comm >= 1 && scores.conflict >= 1) return 'otter';
      
      // 🐅 호랑이: 열정적, 본능적
      if (scores.attach <= 2 && scores.life >= 3 && scores.intimate >= 2) return 'tiger';
      
      // 🐘 코끼리: 기본값 - 안정적, 신뢰
      return 'elephant';
    }

    function calculatePsych(answers) {
      var attachA = 0;
      [0, 9, 11, 13, 16, 22].forEach(function(i) {
        if (answers[i] === 'A') attachA++;
      });
      
      var attach = attachA >= 4 ? 'anxious' : attachA <= 1 ? 'avoidant' : 'secure';
      var love = answers[6] === 'A' ? 'words' : answers[7] === 'A' ? 'touch' : 'acts';
      var conflict = answers[3] === 'A' ? 'fight' : 'flight';
      
      return { attach: attach, love: love, conflict: conflict };
    }

    // 궁합 점수
    function calcCompatScore(a1, a2) {
      var base = 60;
      if (a1 === a2) base += 8; // 같은 동물
      
      // ============================================
      // 가이드 기준 오행 궁합 매트릭스
      // ============================================
      
      // 환상의 궁합 (상생 기반) - Best Pairs
      var bestPairs = {
        // 木(늑대,수달) → 火(사자,뱀,여우): 나무가 불을 지핌
        wolf: ['lion', 'snake', 'fox', 'elephant', 'fish'], // + 水→木 (코끼리,미꾸라지)
        otter: ['lion', 'snake', 'fox', 'dolphin', 'elephant', 'fish'],
        // 火(사자,뱀,여우) → 土(호랑이,판다): 불이 타서 흙이 됨 + 木→火
        lion: ['tiger', 'panda', 'wolf', 'otter'],
        snake: ['tiger', 'panda', 'wolf', 'otter'],
        fox: ['tiger', 'panda', 'wolf', 'otter'],
        // 土(호랑이,판다) → 金(올빼미,고양이): 흙 속에서 금이 생성 + 火→土
        tiger: ['owl', 'cat', 'lion', 'snake', 'fox'],
        panda: ['owl', 'cat', 'lion', 'snake', 'fox'],
        // 金(올빼미,고양이) → 水(돌고래,코끼리,미꾸라지): 바위에서 맑은 물 + 土→金
        owl: ['dolphin', 'elephant', 'fish', 'tiger', 'panda'],
        cat: ['dolphin', 'elephant', 'fish', 'tiger', 'panda'],
        // 水(돌고래,코끼리,미꾸라지) → 木(늑대,수달): 물이 나무를 키움 + 金→水
        dolphin: ['wolf', 'otter', 'owl', 'cat'],
        elephant: ['wolf', 'otter', 'owl', 'cat'],
        fish: ['wolf', 'otter', 'owl', 'cat']
      };
      
      // 주의의 궁합 (상극 기반) - Caution Pairs
      var cautionPairs = {
        // 木剋土: 나무가 흙의 양분을 뺏음
        wolf: ['tiger', 'panda', 'owl', 'cat'], // + 金剋木 (올빼미,고양이)
        otter: ['tiger', 'panda', 'owl', 'cat'],
        // 土剋水: 흙이 물길을 막음
        tiger: ['dolphin', 'elephant', 'fish', 'wolf', 'otter'], // + 木剋土
        panda: ['dolphin', 'elephant', 'fish', 'wolf', 'otter'],
        // 水剋火: 물이 불을 꺼뜨림
        dolphin: ['lion', 'snake', 'fox', 'tiger', 'panda'], // + 土剋水
        elephant: ['lion', 'snake', 'fox', 'tiger', 'panda'],
        fish: ['lion', 'snake', 'fox', 'tiger', 'panda'],
        // 火剋金: 불이 금을 녹여버림
        lion: ['owl', 'cat', 'dolphin', 'elephant', 'fish'], // + 水剋火
        snake: ['owl', 'cat', 'dolphin', 'elephant', 'fish'],
        fox: ['owl', 'cat', 'dolphin', 'elephant', 'fish'],
        // 金剋木: 도끼가 나무를 찍어 넘김
        owl: ['wolf', 'otter', 'lion', 'snake', 'fox'], // + 火剋金
        cat: ['wolf', 'otter', 'lion', 'snake', 'fox']
      };
      
      // Best 궁합 체크 (+15점)
      if (bestPairs[a1] && bestPairs[a1].indexOf(a2) !== -1) {
        base += 15;
      }
      
      // Caution 궁합 체크 (-12점)
      if (cautionPairs[a1] && cautionPairs[a1].indexOf(a2) !== -1) {
        base -= 12;
      }
      
      // 오행 상생상극 추가 계산 (이중 체크로 더 정교화)
      var animal1 = animals[a1];
      var animal2 = animals[a2];
      if (animal1 && animal2) {
        var elemRelation = analyzeElementRelation(animal1.element, animal2.element);
        base += Math.round(elemRelation.score * 0.5); // 상생 +10, 상극 -7.5, 비겁 +5
      }
      
      // 최종 점수 (45~99 범위, 약간의 랜덤성)
      var finalScore = base + Math.floor(Math.random() * 8) - 4;
      return Math.min(99, Math.max(45, finalScore));
    }

    // ============================================
    // 공유 체크 시스템 (visibilitychange)
    // ============================================
    var shareCheckActive = false;
    var shareStartTime = null;
    
    function activateShareCheck() {
      shareCheckActive = true;
      shareStartTime = Date.now();
      document.addEventListener('visibilitychange', handleShareVisibility);
    }
    
    function handleShareVisibility() {
      if (document.visibilityState === 'visible' && shareCheckActive) {
        var elapsed = Date.now() - shareStartTime;
        // 최소 3초 이상 다른 앱에 있었다면 공유한 것으로 간주
        if (elapsed > 3000) {
          shareCheckActive = false;
          document.removeEventListener('visibilitychange', handleShareVisibility);
          localStorage.setItem('shared_free', 'true');
          state.sharedForFree = true;
          
          // GA4: 실제 공유 완료 이벤트
          gtag('event', 'share_confirmed', {
            'event_category': 'engagement',
            'elapsed_time': elapsed
          });
          
          // 공유 확인 메시지
          setTimeout(function() {
            alert('✅ 공유 확인됨!\n심층분석이 무료로 해금되었어요 💕');
            render();
          }, 500);
        }
      }
    }
    
    // 인스타 1:1 카드 저장 함수
    function downloadInstaCard() {
      var card = document.getElementById('insta-card');
      if (!card || typeof html2canvas === 'undefined') {
        alert('잠시 후 다시 시도해주세요');
        return;
      }
      
      // GA4: 인스타 카드 저장 이벤트
      gtag('event', 'insta_card_download', {
        'event_category': 'engagement',
        'animal_type': state.animalCode
      });
      
      html2canvas(card, {
        scale: 2,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#ffffff'
      }).then(function(canvas) {
        canvas.toBlob(function(blob) {
          // Web Share API로 바로 공유 시도 (모바일)
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], 'love-animal-card.png', { type: 'image/png' })] })) {
            var file = new File([blob], 'love-animal-card.png', { type: 'image/png' });
            navigator.share({
              files: [file],
              title: '나의 연애 동물 테스트',
              text: '내 연애 동물은? 💕'
            }).then(function() {
              activateShareCheck();
            }).catch(function() {
              // 공유 취소해도 이미지 저장
              saveBlob(blob);
            });
          } else {
            saveBlob(blob);
          }
        }, 'image/png', 1.0);
      });
      
      function saveBlob(blob) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'love-animal-card.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('📸 이미지가 저장되었어요!\n인스타 스토리에 공유해보세요 💕');
      }
    }

    // SNS 공유 - 모바일 최적화 + visibilitychange 체크
    function shareToSNS(platform) {
      // GA4: 공유 버튼 클릭 이벤트
      gtag('event', 'share', {
        'event_category': 'engagement',
        'method': platform,
        'content_type': 'test_result',
        'animal_type': state.animalCode
      });
      
      // 먼저 상태 저장 (뒤로가기 대비)
      saveState();
      
      var animal = animals[state.animalCode];
      
      // 결과 포함 URL 생성
      var viewParams = 'view=' + state.animalCode + 
        '&name=' + encodeURIComponent(state.nickname || '익명') +
        '&year=' + (state.birthYear || 1995);
      var shareUrl = location.origin + location.pathname + '?' + viewParams;
      
      var shareText = animal.emoji + ' 나의 연애 동물은 "' + animal.name + '"!\n\n' +
        animal.slogan + '\n\n' +
        '내 결과 보러가기 👉';
      
      // 공유 체크 활성화
      activateShareCheck();
      
      // Web Share API 지원 확인 (모바일 최적화)
      if (navigator.share && (platform === 'kakaotalk' || platform === 'instagram')) {
        navigator.share({
          title: '나의 연애 동물: ' + animal.name,
          text: shareText,
          url: shareUrl
        }).then(function() {
          // 공유 완료 - visibilitychange에서 처리
        }).catch(function() {
          // 공유 취소
          shareCheckActive = false;
        });
        return;
      }
      
      // 플랫폼별 처리
      var fullShareText = shareText + '\n' + shareUrl + '\n#연애동물테스트 #밸런스게임';
      var encodedText = encodeURIComponent(fullShareText);
      var encodedUrl = encodeURIComponent(shareUrl);
      
      if (platform === 'twitter') {
        window.open('https://twitter.com/intent/tweet?text=' + encodedText, '_blank');
      } else if (platform === 'facebook') {
        window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl, '_blank');
      } else if (platform === 'kakaotalk') {
        // 카카오톡 - 링크 복사 후 앱 열기
        copyToClipboard(shareText + '\n' + shareUrl);
        alert('📋 링크가 복사되었어요!\n카카오톡에 붙여넣기 해주세요 💬');
      } else if (platform === 'instagram') {
        // 인스타그램 - 이미지 저장 시도 후 앱 열기
        downloadInstaCard();
      }
    }

    // 클립보드 복사 (호환성 높은 버전)
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    
    function fallbackCopy(text) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(textarea);
    }

    // 이미지 저장 (모바일 최적화)
    function downloadResultImage(callback) {
      var el = document.getElementById('result-card');
      if (!el || !window.html2canvas) {
        if (callback) callback();
        return;
      }
      
      // 로딩 표시
      var loadingDiv = document.createElement('div');
      loadingDiv.id = 'image-loading';
      loadingDiv.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50';
      loadingDiv.innerHTML = '<div class="text-white text-center"><div class="text-4xl mb-3">📸</div><p>이미지 생성 중...</p></div>';
      document.body.appendChild(loadingDiv);
      
      html2canvas(el, { 
        scale: 2, 
        backgroundColor: '#fff',
        useCORS: true,
        allowTaint: true
      }).then(function(canvas) {
        // 로딩 제거
        var loading = document.getElementById('image-loading');
        if (loading) loading.remove();
        
        // 모바일 체크
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile) {
          // 모바일: Web Share API 시도
          canvas.toBlob(function(blob) {
            if (!blob) {
              showImageOverlay(canvas.toDataURL('image/png'));
              return;
            }
            
            var file = new File([blob], '연애동물_' + state.nickname + '.png', { type: 'image/png' });
            
            // Web Share API (파일 공유) 지원 확인
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              navigator.share({
                files: [file],
                title: '나의 연애 동물 결과',
                text: '연애동물테스트 결과를 확인해보세요!'
              }).then(function() {
                // 공유 성공
                if (callback) callback();
              }).catch(function(err) {
                // 사용자가 취소했거나 실패 - 폴백으로 오버레이 표시
                if (err.name !== 'AbortError') {
                  showImageOverlay(canvas.toDataURL('image/png'));
                }
                if (callback) callback();
              });
            } else {
              // Web Share API 미지원 - 오버레이로 폴백
              showImageOverlay(canvas.toDataURL('image/png'));
              if (callback) callback();
            }
          }, 'image/png');
        } else {
          // PC: 직접 다운로드
          var link = document.createElement('a');
          link.download = '연애동물_' + state.nickname + '.png';
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          if (callback) callback();
        }
      }).catch(function() {
        var loading = document.getElementById('image-loading');
        if (loading) loading.remove();
        alert('이미지 생성에 실패했어요. 다시 시도해주세요.');
        if (callback) callback();
      });
    }

    function initCardSwiper() {
      var swiper = document.getElementById('cardSwiper');
      if (swiper) {
        swiper.scrollLeft = 0;
        updateCardDots();
      }
    }
    
    function updateCardDots() {
      var swiper = document.getElementById('cardSwiper');
      var dots = document.querySelectorAll('#cardDots .card-dot');
      if (!swiper || !dots.length) return;
      
      var cardWidth = swiper.offsetWidth;
      var scrollPos = swiper.scrollLeft;
      var currentCard = Math.round(scrollPos / (cardWidth * 0.85)); // 카드 너비 + 간격 고려
      
      dots.forEach(function(dot, i) {
        dot.classList.toggle('active', i === currentCard);
      });
    }

    function showEncouragement(message) {
      var popup = document.createElement('div');

    // ============================================
    // 질문 뒤로가기 함수
    // ============================================
    function goBackQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        state.answers.pop(); // 마지막 답변 삭제
        render();
      }
    }
    
    function goBackPremiumQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        state.premiumAnswers.pop(); // 마지막 답변 삭제
        render();
      }
    }

    function answer(c) {
      state.answers.push(c);
      
      // 중간 격려 (5번째 질문)
      if (state.currentQ === 4) {
        showEncouragement('👀 오호~ 성향이 보이기 시작해요!');
      }
      
      if (state.currentQ < 9) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          state.animalCode = calculateAnimal(state.answers);
          state.psychProfile = calculatePsych(state.answers);
          saveState();
          if (state.inviteCode && state.inviterData) {
            completeCompat();
            state.page = 'compat_result';
          } else {
            state.page = 'free_result';
          }
          render();
        }, 2000);
      }
    }

    function answerPremium(c) {
      state.premiumAnswers.push(c);
      
      // 중간 격려 팝업
      if (state.currentQ === 7) {
        showEncouragement('🔥 은밀한 본능 분석 중...');
      } else if (state.currentQ === 15) {
        showEncouragement('💋 침대 성향 계산 중... 두근');
      } else if (state.currentQ === 22) {
        showEncouragement('🎯 거의 다 왔어요! 마지막 스퍼트!');
      }
      
      if (state.currentQ < 24) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          var allAnswers = state.answers.concat(state.premiumAnswers);
          state.animalCode = calculateAnimal(allAnswers);
          state.psychProfile = calculatePsych(allAnswers);
          state.answers = allAnswers;
          saveState();
          if (state.isCompatibility) {
            createInvite().then(function() { state.page = 'create_invite'; render(); });
          } else {
            state.page = 'premium_result';
            render();
          }
        }, 2000);
      }
    }

      var a = animals[state.animalCode];
      var t = a.emoji + ' ' + state.nickname + '의 연애 동물: ' + a.name + '\n' + a.slogan + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) {
        navigator.share({ title: '연애 동물 테스트', text: t, url: location.origin + location.pathname });
      } else { 
        copyToClipboard(t); 
        alert('✅ 복사 완료!\n친구에게 공유해보세요 💕'); 
      }
    }

    function shareCompatResult() {
      saveState();
      var me = animals[state.animalCode];
      var them = animals[state.inviterData.animalCode];
      var t = '💕 ' + state.inviterData.nickname + ' × ' + state.nickname + ' 궁합!\n' + them.emoji + ' × ' + me.emoji + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) {
        navigator.share({ title: '커플 궁합', text: t, url: location.origin + location.pathname });
      } else { 
        copyToClipboard(t); 
        alert('✅ 복사 완료!\n친구에게 공유해보세요 💕'); 
      }
    }

    function restart() {
      localStorage.removeItem('love_animal_v4');
      localStorage.removeItem('shared_free');
      localStorage.removeItem('loveAnimalState');
      state = { page: 'landing', gender: null, nickname: '', currentQ: 0, answers: [], premiumAnswers: [], animalCode: null, psychProfile: null, isPremium: false, isCompatibility: false, sharedForFree: false, inviteCode: null, inviterData: null, myInviteCode: null };
      history.replaceState({}, '', location.pathname);
      render();
    }

    // 초기화 - 상태 복원 포함
    (async function() {
      // 뒤로가기로 돌아온 경우 상태 복원
      if (restoreState()) {
        // 결과 페이지로 복원됨
        render();
        return;
      }
      
      // URL에 초대 코드 있는 경우
      if (state.page === 'create_invite' && state.isCompatibility && !state.myInviteCode) {
        await createInvite();
      }
      render();
    })();
  </script>
</body>
</html>
