    var heavenlyStems = ['갑(甲)', '을(乙)', '병(丙)', '정(丁)', '무(戊)', '기(己)', '경(庚)', '신(辛)', '임(壬)', '계(癸)'];

    var elementNames = { wood: '목(木)', fire: '화(火)', earth: '토(土)', metal: '금(金)', water: '수(水)' };

    // 연주(年柱) 계산
    function getYearPillar(year) {
      var stemIdx = (year - 4) % 10;
      var branchIdx = (year - 4) % 12;
      return {
        stem: heavenlyStems[stemIdx],
        branch: earthlyBranches[branchIdx],
        stemElement: stemElements[stemIdx],

        pillar: heavenlyStems[stemIdx].charAt(0) + earthlyBranches[branchIdx].charAt(0)

    // 오행 관계 분석 (가이드 기준: 상생 +20, 상극 -15, 비겁 +10)
    function analyzeElementRelation(elem1, elem2) {
      if (elem1 === elem2) return { type: 'same', desc: '같은 기운끼리! 서로를 깊이 이해하지만 충돌도 가능해요', score: 10 };
      if (elementRelations.generates[elem1] === elem2) return { type: 'generate', desc: elem1 + '이 ' + elem2 + '를 키워주는 상생 관계! 환상의 궁합 💕', score: 20 };
      if (elementRelations.generates[elem2] === elem1) return { type: 'generated', desc: elem2 + '가 ' + elem1 + '를 키워주는 상생 관계! 환상의 궁합 💕', score: 20 };

      if (elementRelations.overcomes[elem2] === elem1) return { type: 'overcomed', desc: '기운이 충돌하는 상극 관계! 배려와 이해가 필요해요 ⚡', score: -15 };
      return { type: 'neutral', desc: '서로 다른 기운이 조화를 이뤄요', score: 0 };
    }

        fire: ['lion', 'snake', 'fox'],
        earth: ['tiger', 'panda'],
        metal: ['owl', 'cat'],
        water: ['dolphin', 'elephant', 'fish']
      };
      
      if (state.birthYear) {
        var yearEnd = state.birthYear % 10;
        var myElement = yearEnd <= 1 ? 'metal' : yearEnd <= 3 ? 'water' : yearEnd <= 5 ? 'wood' : yearEnd <= 7 ? 'fire' : 'earth';
        if (elementAnimals[myElement]) {
          elementAnimals[myElement].forEach(function(a) {
            animalScores[a] += 1;
          });
        }
      }
      
      // 최고 점수 동물 찾기
      var maxAnimal = 'elephant';
      var maxScore = -999;
      Object.keys(animalScores).forEach(function(animal) {
        if (animalScores[animal] > maxScore) {
          maxScore = animalScores[animal];
          maxAnimal = animal;
        }
      });
      
      return maxAnimal;
    }

    // 심리 유형 계산
    function calculatePsych(answers) {
      var attachA = 0;
      [0, 9, 11, 13, 16, 22].forEach(function(i) {
        if (answers[i] === 'A') attachA++;
      });
      
      var attach = attachA >= 4 ? 'anxious' : attachA <= 1 ? 'avoidant' : 'secure';
      var love = answers[6] === 'A' ? 'words' : answers[7] === 'A' ? 'touch' : 'acts';
      var conflict = answers[3] === 'A' ? 'fight' : 'flight';
      
      return { attach: attach, love: love, conflict: conflict };
    }

    // 궁합 점수
    function calcCompatScore(a1, a2) {
      var base = 60;
      if (a1 === a2) base += 8; // 같은 동물
      
      // ============================================
      // 가이드 기준 오행 궁합 매트릭스
      // ============================================
      
      // 환상의 궁합 (상생 기반) - Best Pairs
      var bestPairs = {
        // 木(늑대,수달) → 火(사자,뱀,여우): 나무가 불을 지핌
        wolf: ['lion', 'snake', 'fox', 'elephant', 'fish'], // + 水→木 (코끼리,미꾸라지)
        otter: ['lion', 'snake', 'fox', 'dolphin', 'elephant', 'fish'],
        // 火(사자,뱀,여우) → 土(호랑이,판다): 불이 타서 흙이 됨 + 木→火
        lion: ['tiger', 'panda', 'wolf', 'otter'],
        snake: ['tiger', 'panda', 'wolf', 'otter'],
        fox: ['tiger', 'panda', 'wolf', 'otter'],
        // 土(호랑이,판다) → 金(올빼미,고양이): 흙 속에서 금이 생성 + 火→土
        tiger: ['owl', 'cat', 'lion', 'snake', 'fox'],
        panda: ['owl', 'cat', 'lion', 'snake', 'fox'],
        // 金(올빼미,고양이) → 水(돌고래,코끼리,미꾸라지): 바위에서 맑은 물 + 土→金
        owl: ['dolphin', 'elephant', 'fish', 'tiger', 'panda'],
        cat: ['dolphin', 'elephant', 'fish', 'tiger', 'panda'],
        // 水(돌고래,코끼리,미꾸라지) → 木(늑대,수달): 물이 나무를 키움 + 金→水
        dolphin: ['wolf', 'otter', 'owl', 'cat'],
        elephant: ['wolf', 'otter', 'owl', 'cat'],
        fish: ['wolf', 'otter', 'owl', 'cat']
      };
      
      // 주의의 궁합 (상극 기반) - Caution Pairs
      var cautionPairs = {
        // 木剋土: 나무가 흙의 양분을 뺏음
        wolf: ['tiger', 'panda', 'owl', 'cat'], // + 金剋木 (올빼미,고양이)
        otter: ['tiger', 'panda', 'owl', 'cat'],
        // 土剋水: 흙이 물길을 막음
        tiger: ['dolphin', 'elephant', 'fish', 'wolf', 'otter'], // + 木剋土
        panda: ['dolphin', 'elephant', 'fish', 'wolf', 'otter'],
        // 水剋火: 물이 불을 꺼뜨림
        dolphin: ['lion', 'snake', 'fox', 'tiger', 'panda'], // + 土剋水
        elephant: ['lion', 'snake', 'fox', 'tiger', 'panda'],
        fish: ['lion', 'snake', 'fox', 'tiger', 'panda'],
        // 火剋金: 불이 금을 녹여버림
        lion: ['owl', 'cat', 'dolphin', 'elephant', 'fish'], // + 水剋火
        snake: ['owl', 'cat', 'dolphin', 'elephant', 'fish'],
        fox: ['owl', 'cat', 'dolphin', 'elephant', 'fish'],
        // 金剋木: 도끼가 나무를 찍어 넘김
        owl: ['wolf', 'otter', 'lion', 'snake', 'fox'], // + 火剋金
        cat: ['wolf', 'otter', 'lion', 'snake', 'fox']
      };
      
      // Best 궁합 체크 (+15점)
      if (bestPairs[a1] && bestPairs[a1].indexOf(a2) !== -1) {
        base += 15;
      }
      
      // Caution 궁합 체크 (-12점)
      if (cautionPairs[a1] && cautionPairs[a1].indexOf(a2) !== -1) {
        base -= 12;
      }
      
      // 오행 상생상극 추가 계산 (이중 체크로 더 정교화)
      var animal1 = animals[a1];
      var animal2 = animals[a2];
      if (animal1 && animal2) {
        var elemRelation = analyzeElementRelation(animal1.element, animal2.element);
        base += Math.round(elemRelation.score * 0.5); // 상생 +10, 상극 -7.5, 비겁 +5
      }
      
      // 최종 점수 (45~99 범위, 약간의 랜덤성)
      var finalScore = base + Math.floor(Math.random() * 8) - 4;
      return Math.min(99, Math.max(45, finalScore));
    }
    
    // 오행 궁합 날카로운 한 줄 조언 생성
    function getElementAdvice(a1, a2) {
      var animal1 = animals[a1];
      var animal2 = animals[a2];
      if (!animal1 || !animal2) return '';
      
      var relation = analyzeElementRelation(animal1.element, animal2.element);
      var advices = {

          '"사주적으로 찰떡궁합! ' + animal1.emoji + '가 ' + animal2.emoji + '에게 에너지를 불어넣어요"'
        ],
        'generated': [
          '"' + animal2.elementName + '이 ' + animal1.elementName + '를 키워주는 관계! 받는 쪽이 더 성장해요"',
          '"운명적 상생! ' + animal2.emoji + '가 ' + animal1.emoji + '를 성장하게 만들어요"'
        ],
        'overcome': [
          '"' + animal1.elementName + '이 ' + animal2.elementName + '를 억누르는 기운... 배려가 필수!"',
          '"사주적 충돌 주의! ' + animal1.emoji + '가 무심코 ' + animal2.emoji + '를 상처줄 수 있어요"'
        ],
        'overcomed': [
          '"' + animal2.elementName + '이 ' + animal1.elementName + '를 억누를 수 있어요. 서로 한 발 양보!"',
          '"기운 충돌 감지! ' + animal2.emoji + '의 강함이 ' + animal1.emoji + '를 위축시킬 수 있어요"'
        ],
        'same': [
          '"같은 ' + animal1.elementName + ' 기운! 이해는 빠르지만 싸우면 격해져요"',
          '"동일 오행 커플! 서로를 거울처럼 비추지만, 같은 단점도 증폭돼요"'
        ],
        'neutral': [
          '"서로 다른 기운이 만나 새로운 조화를 만들어요"',
          '"특별한 상생도 상극도 아닌, 노력으로 만들어가는 관계!"'
        ]
      };
      
      var typeAdvices = advices[relation.type] || advices['neutral'];
      return typeAdvices[Math.floor(Math.random() * typeAdvices.length)];
    }
    
    // 오행 궁합 설명 생성
    function getElementCompatDesc(a1, a2) {
      var animal1 = animals[a1];
      var animal2 = animals[a2];
      if (!animal1 || !animal2) return '';
      
      var relation = analyzeElementRelation(animal1.element, animal2.element);
      var emoji1 = animal1.elementEmoji;
      var emoji2 = animal2.elementEmoji;
      var name1 = animal1.elementName;
      var name2 = animal2.elementName;
      
      if (relation.type === 'same') {
        return emoji1 + ' ' + name1 + ' + ' + emoji2 + ' ' + name2 + ' = 같은 기운! 이해는 빠르지만 충돌 주의';
      } else if (relation.type === 'generate' || relation.type === 'generated') {
        return emoji1 + ' ' + name1 + ' → ' + emoji2 + ' ' + name2 + ' = 환상의 상생! 서로를 키워주는 관계 💕';
      } else if (relation.type === 'overcome' || relation.type === 'overcomed') {
        return emoji1 + ' ' + name1 + ' ⚡ ' + emoji2 + ' ' + name2 + ' = 상극 관계! 서로 맞춰가는 노력 필요';
      }
      return emoji1 + ' ' + name1 + ' ~ ' + emoji2 + ' ' + name2 + ' = 서로 다른 기운이 새로운 조화를 만들어요';
    }

    var shareCheckActive = false;
    var shareStartTime = null;
    
    function activateShareCheck() {
      shareCheckActive = true;
      shareStartTime = Date.now();
      document.addEventListener('visibilitychange', handleShareVisibility);
    }
    
    function handleShareVisibility() {
      if (document.visibilityState === 'visible' && shareCheckActive) {
        var elapsed = Date.now() - shareStartTime;
        // 최소 3초 이상 다른 앱에 있었다면 공유한 것으로 간주
        if (elapsed > 3000) {
          shareCheckActive = false;
          document.removeEventListener('visibilitychange', handleShareVisibility);
          localStorage.setItem('shared_free', 'true');
          state.sharedForFree = true;
          
          // GA4: 실제 공유 완료 이벤트
          gtag('event', 'share_confirmed', {
            'event_category': 'engagement',
            'elapsed_time': elapsed
          });
          
          // 공유 확인 메시지
          setTimeout(function() {
            alert('✅ 공유 확인됨!\n심층분석이 무료로 해금되었어요 💕');
            render();
          }, 500);
        }
      }
    }

    // 클립보드 복사 (호환성 높은 버전)
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(function() {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }
    
    function fallbackCopy(text) {
      var textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.left = '-9999px';
      document.body.appendChild(textarea);
      textarea.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(textarea);
    }

    // 이미지 저장 (모바일 최적화)
    function downloadResultImage(callback) {
      var el = document.getElementById('result-card');
      if (!el || !window.html2canvas) {
        if (callback) callback();
        return;
      }
      
      // 로딩 표시
      var loadingDiv = document.createElement('div');
      loadingDiv.id = 'image-loading';
      loadingDiv.className = 'fixed inset-0 bg-black/70 flex items-center justify-center z-50';
      loadingDiv.innerHTML = '<div class="text-white text-center"><div class="text-4xl mb-3">📸</div><p>이미지 생성 중...</p></div>';
      document.body.appendChild(loadingDiv);
      
      html2canvas(el, { 
        scale: 2, 
        backgroundColor: '#fff',
        useCORS: true,
        allowTaint: true
      }).then(function(canvas) {
        // 로딩 제거
        var loading = document.getElementById('image-loading');
        if (loading) loading.remove();
        
        // 모바일 체크
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        
        if (isMobile) {
          // 모바일: Web Share API 시도
          canvas.toBlob(function(blob) {
            if (!blob) {
              showImageOverlay(canvas.toDataURL('image/png'));
              return;
            }
            
            var file = new File([blob], '연애동물_' + state.nickname + '.png', { type: 'image/png' });
            
            // Web Share API (파일 공유) 지원 확인
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              navigator.share({
                files: [file],
                title: '나의 연애 동물 결과',
                text: '연애동물테스트 결과를 확인해보세요!'
              }).then(function() {
                // 공유 성공
                if (callback) callback();
              }).catch(function(err) {
                // 사용자가 취소했거나 실패 - 폴백으로 오버레이 표시
                if (err.name !== 'AbortError') {
                  showImageOverlay(canvas.toDataURL('image/png'));
                }
                if (callback) callback();
              });
            } else {
              // Web Share API 미지원 - 오버레이로 폴백
              showImageOverlay(canvas.toDataURL('image/png'));
              if (callback) callback();
            }
          }, 'image/png');
        } else {
          // PC: 직접 다운로드
          var link = document.createElement('a');
          link.download = '연애동물_' + state.nickname + '.png';
          link.href = canvas.toDataURL('image/png');
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          if (callback) callback();
        }
      }).catch(function() {
        var loading = document.getElementById('image-loading');
        if (loading) loading.remove();
        alert('이미지 생성에 실패했어요. 다시 시도해주세요.');
        if (callback) callback();
      });
    }

    var _backMap = {
      'gender': 'landing',

      'free_test': 'nickname',
      'premium_test': 'free_result',
      'loading': null,           // 로딩 중에는 뒤로가기 무시

    };
    
    window.addEventListener('popstate', function(e) {
      // 로딩 중이면 무시
      if (state.page === 'loading') { 
        history.pushState({ page: 'loading' }, ''); 
        return; 
      }
      
      // 테스트 진행 중이면 이전 질문으로
      if (state.page === 'free_test' && state.currentQ > 0) {
        goBackQuestion();
        history.pushState({ page: 'free_test', q: state.currentQ }, '');
        return;
      }
      if (state.page === 'premium_test' && state.currentQ > 0) {
        goBackPremiumQuestion();
        history.pushState({ page: 'premium_test', q: state.currentQ }, '');
        return;
      }
      
      // 일반 페이지 뒤로가기
      var dest = _backMap[state.page];
      if (dest) {
        state.page = dest;
        render();
      }
      // dest가 null이거나 landing이면 아무것도 안 함
    });

    function initCardSwiper() {
      var swiper = document.getElementById('cardSwiper');
      if (swiper) {
        swiper.scrollLeft = 0;
        updateCardDots();
      }
    }
    
    function updateCardDots() {
      var swiper = document.getElementById('cardSwiper');
      var dots = document.querySelectorAll('#cardDots .card-dot');
      if (!swiper || !dots.length) return;
      
      var cardWidth = swiper.offsetWidth;
      var scrollPos = swiper.scrollLeft;
      var currentCard = Math.round(scrollPos / (cardWidth * 0.85)); // 카드 너비 + 간격 고려
      
      dots.forEach(function(dot, i) {
        dot.classList.toggle('active', i === currentCard);
      });
    }

      if (detail) {

    // 펼치기/접기
    function toggleExpand(id) {
      var el = document.getElementById(id);
      var arrow = document.getElementById('arrow-' + id);
      if (el) {
        el.classList.toggle('open');
        if (arrow) arrow.textContent = el.classList.contains('open') ? '▲' : '▼';
      }
    }

    // ============================================
    // 이벤트
    // ============================================
    function goGender() { 
      gtag('event', 'funnel_step', { 'step': 'landing_cta', 'step_number': 1 });
      state.page = 'gender'; render(); 
    }
    function selectGender(g) { 
      gtag('event', 'funnel_step', { 'step': 'gender_selected', 'step_number': 2, 'gender': g });
      state.gender = g; state.page = 'nickname'; render(); 
    }
    function startTest() {
      var nameEl = document.getElementById('nameInput');
      var yearEl = document.getElementById('yearInput');
      var monthEl = document.getElementById('monthInput');
      var dayEl = document.getElementById('dayInput');
      
      if (nameEl && nameEl.value.trim()) {
        state.nickname = nameEl.value.trim();
        state.birthYear = yearEl ? parseInt(yearEl.value) || 1995 : 1995;
        state.birthMonth = monthEl ? parseInt(monthEl.value) || 1 : 1;
        state.birthDay = dayEl ? parseInt(dayEl.value) || 1 : 1;
        state.currentQ = 0;
        state.answers = [];
        state.page = 'free_test';
        
        // GA4: 테스트 시작 이벤트
        gtag('event', 'test_start', {
          'event_category': 'engagement',
          'gender': state.gender,
          'birth_year': state.birthYear
        });
        
        render();
      }
    }

    // 중간 격려 팝업 표시
    function showEncouragement(message) {
      var popup = document.createElement('div');
      popup.className = 'fixed top-20 left-1/2 transform -translate-x-1/2 bg-white rounded-2xl shadow-2xl p-4 z-50 max-w-xs text-center animate-bounce';
      popup.innerHTML = '<p class="text-lg font-bold text-purple-600">' + message + '</p>';
      document.body.appendChild(popup);
      setTimeout(function() { popup.remove(); }, 2500);
    }

    // ============================================
    // 질문 뒤로가기 함수
    // ============================================
    function goBackQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        state.answers.pop(); // 마지막 답변 삭제
        render();
      }
    }
    
    function goBackPremiumQuestion() {
      if (state.currentQ > 0) {
        state.currentQ--;
        state.premiumAnswers.pop(); // 마지막 답변 삭제
        render();
      }
    }

    function answer(c) {
      state.answers.push(c);
      
      // GA4: 질문별 진행률 (드랍오프 분석용)
      gtag('event', 'question_answered', { 
        'question_number': state.currentQ + 1, 
        'test_type': 'free', 
        'total_questions': 10 
      });
      
      // 중간 격려 (5번째 질문)
      if (state.currentQ === 4) {
        showEncouragement('👀 오호~ 성향이 보이기 시작해요!');
      }
      
      if (state.currentQ < 9) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          state.animalCode = calculateAnimal(state.answers);
          state.psychProfile = calculatePsych(state.answers);
          saveState();
          incrementCount(); // 참여자 수 +1
          if (state.inviteCode && state.inviterData) {
            completeCompat();
            state.page = 'compat_result';
          } else {
            state.page = 'free_result';
          }
          render();
        }, 2000);
      }
    }

    function answerPremium(c) {
      state.premiumAnswers.push(c);
      
      // GA4: 프리미엄 질문 진행률
      gtag('event', 'question_answered', { 
        'question_number': state.currentQ + 1, 
        'test_type': 'premium', 
        'total_questions': 25 
      });
      
      // 중간 격려 팝업
      if (state.currentQ === 7) {
        showEncouragement('🔥 은밀한 본능 분석 중...');
      } else if (state.currentQ === 15) {
        showEncouragement('💋 침대 성향 계산 중... 두근');
      } else if (state.currentQ === 22) {
        showEncouragement('🎯 거의 다 왔어요! 마지막 스퍼트!');
      }
      
      if (state.currentQ < 24) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          var allAnswers = state.answers.concat(state.premiumAnswers);
          state.animalCode = calculateAnimal(allAnswers);
          state.psychProfile = calculatePsych(allAnswers);
          state.answers = allAnswers;
          saveState();
          incrementCount(); // 참여자 수 +1
          if (state.isCompatibility) {
            createInvite().then(function() { state.page = 'create_invite'; render(); });
          } else {
            state.page = 'premium_result';
            render();
          }
        }, 2000);
      }
    }

    function startPremiumFree() {
      state.isPremium = true;
      state.currentQ = 0;
      state.premiumAnswers = [];
      state.page = 'premium_test';
      render();
    }

    function goPay(t) {
      // GA4: 결제 버튼 클릭 이벤트
      gtag('event', 'begin_checkout', {
        'event_category': 'purchase',
        'item_name': t,
        'value': t === 'bundle' ? 5000 : 3000,
        'currency': 'KRW'
      });
      
      saveState();
      location.href = LATPEED[t];
    }
    function goMyResult() { state.page = state.isPremium ? 'premium_result' : 'free_result'; render(); }
    
    function copyInviteLink(url) {
      copyToClipboard(url);
      alert('✅ 링크 복사됨!\n\n연인에게 보내세요 💕');
    }

    function shareResult() {
      saveState();
      var a = animals[state.animalCode];
      var t = a.emoji + ' ' + state.nickname + '의 연애 동물: ' + a.name + '\n' + a.slogan + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) {
        navigator.share({ title: '연애 동물 테스트', text: t, url: location.origin + location.pathname });
      } else { 
        copyToClipboard(t); 
        alert('✅ 복사 완료!\n친구에게 공유해보세요 💕'); 
      }
    }

    function shareCompatResult() {
      saveState();
      var me = animals[state.animalCode];
      var them = animals[state.inviterData.animalCode];
      var t = '💕 ' + state.inviterData.nickname + ' × ' + state.nickname + ' 궁합!\n' + them.emoji + ' × ' + me.emoji + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) {
        navigator.share({ title: '커플 궁합', text: t, url: location.origin + location.pathname });
      } else { 
        copyToClipboard(t); 
        alert('✅ 복사 완료!\n친구에게 공유해보세요 💕'); 
      }
    }

    function restart() {
      localStorage.removeItem('love_animal_v5');
      localStorage.removeItem('shared_free');
      localStorage.removeItem('loveAnimalState');
      state = { page: 'landing', gender: null, nickname: '', currentQ: 0, answers: [], premiumAnswers: [], animalCode: null, psychProfile: null, isPremium: false, isCompatibility: false, sharedForFree: false, inviteCode: null, inviterData: null, myInviteCode: null };
      history.replaceState({}, '', location.pathname);
      render();
    }

    // 초기화 - 상태 복원 포함
    (async function() {
      // 뒤로가기로 돌아온 경우 상태 복원
      if (restoreState()) {
        // 결과 페이지로 복원됨
        render();
        return;
      }
      
      // URL에 초대 코드 있는 경우
      if (state.page === 'create_invite' && state.isCompatibility && !state.myInviteCode) {
        await createInvite();
      }
      render();
    })();
  </script>
