    function generateCode() {
      var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = '';
      for (var i = 0; i < 6; i++) r += c[Math.floor(Math.random() * c.length)];
      return r;
    }

    // 동물 계산
    function calculateAnimal(answers) {
      var scores = { attach: 0, devote: 0, comm: 0, conflict: 0, life: 0, love: 0, intimate: 0 };
      var allQ = freeQuestions.concat(premiumQuestions);
      
      answers.forEach(function(a, i) {
        var q = allQ[i];
        if (!q) return;
        if (a === 'A') scores[q.axis] = (scores[q.axis] || 0) + 1;
      });

      var total = scores.attach + scores.devote + scores.comm + scores.life + scores.intimate;
      
      // 동물 결정 로직
      if (scores.devote >= 3 && scores.comm >= 2) return 'wolf';
      if (scores.life >= 4 && scores.intimate >= 3) return 'dolphin';
      if (scores.comm <= 1 && scores.conflict <= 1) return 'panda';
      if (scores.comm >= 3 && scores.devote >= 2) return 'lion';
      if (scores.attach <= 2 && scores.comm <= 2) return 'owl';
      if (total >= 12 && total <= 18) return 'otter';
      if (scores.attach <= 2 && scores.life >= 3) return 'tiger';
      return 'elephant';
    }

    // 심리 유형 계산
    function calculatePsych(answers) {
      var attachA = 0;
      [0, 9, 11, 13, 16, 22].forEach(function(i) {
        if (answers[i] === 'A') attachA++;
      });
      
      var attach = attachA >= 4 ? 'anxious' : attachA <= 1 ? 'avoidant' : 'secure';
      var love = answers[6] === 'A' ? 'words' : answers[7] === 'A' ? 'touch' : 'acts';
      var conflict = answers[3] === 'A' ? 'fight' : 'flight';
      
      return { attach: attach, love: love, conflict: conflict };
    }

    // 궁합 점수
    function calcCompatScore(a1, a2) {
      var base = 65;
      if (a1 === a2) base += 10;
      var good = [['wolf','panda'],['lion','panda'],['dolphin','otter'],['owl','elephant'],['tiger','dolphin']];
      good.forEach(function(pair) {
        if ((a1 === pair[0] && a2 === pair[1]) || (a1 === pair[1] && a2 === pair[0])) base += 15;
      });
      return Math.min(99, base + Math.floor(Math.random() * 10));
    }

            answers: r.data.inviter_answers,
            pairId: r.data.id

          render();
        }
      } catch(e) { console.log(e); }
    }

      try {

        '<div class="gradient-bg-couple py-8 px-6 text-center text-white">' +
        '<p class="text-sm opacity-90 mb-2">💕 커플 궁합 결과</p>' +
        '<div class="flex justify-center items-center gap-4 my-4">' +
        '<div class="text-center"><span class="text-5xl">' + them.animal.emoji + '</span><p class="text-sm mt-1">' + them.name + '</p></div>' +
        '<div class="text-4xl heartbeat">❤️</div>' +
        '<div class="text-center"><span class="text-5xl">' + me.animal.emoji + '</span><p class="text-sm mt-1">' + me.name + '</p></div></div>' +
        '<div class="text-5xl font-bold">' + score + '<span class="text-2xl">점</span></div>' +
        '<p class="text-sm opacity-80 mt-2">' + them.animal.name + ' × ' + me.animal.name + '</p></div>' +
        
        '<div class="px-5 py-4">' +
        '<p class="text-center text-gray-600">' + (score >= 85 ? '🔥 환상의 궁합!' : score >= 75 ? '💕 좋은 궁합!' : '💪 노력하면 더 좋아져요!') + '</p>' +
        '</div></div>' +
        
        '<button onclick="shareCompatResult()" class="w-full py-3 bg-white border text-gray-600 rounded-2xl mb-4">📱 궁합 공유</button>' +
        '<button onclick="restart()" class="w-full py-2 text-gray-400 text-sm">처음부터</button>' +
        '</div></div>';
    }

    // 펼치기/접기
    function toggleExpand(id) {
      var el = document.getElementById(id);
      var arrow = document.getElementById('arrow-' + id);
      if (el) {
        el.classList.toggle('open');
        if (arrow) arrow.textContent = el.classList.contains('open') ? '▲' : '▼';
      }
    }

    // ============================================
    // 이벤트
    // ============================================
    function goGender() { state.page = 'gender'; render(); }
    function selectGender(g) { state.gender = g; state.page = 'nickname'; render(); }
    function startTest() {
      var el = document.getElementById('nameInput');
      if (el && el.value.trim()) {
        state.nickname = el.value.trim();
        state.currentQ = 0;
        state.answers = [];
        state.page = 'free_test';
        render();
      }
    }

    function answer(c) {
      state.answers.push(c);
      if (state.currentQ < 9) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          state.animalCode = calculateAnimal(state.answers);
          state.psychProfile = calculatePsych(state.answers);
          saveState();
          if (state.inviteCode && state.inviterData) {
            completeCompat();
            state.page = 'compat_result';
          } else {
            state.page = 'free_result';
          }
          render();
        }, 2000);
      }
    }

    function answerPremium(c) {
      state.premiumAnswers.push(c);
      if (state.currentQ < 24) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          var allAnswers = state.answers.concat(state.premiumAnswers);
          state.animalCode = calculateAnimal(allAnswers);
          state.psychProfile = calculatePsych(allAnswers);
          state.answers = allAnswers;
          saveState();
          if (state.isCompatibility) {
            createInvite().then(function() { state.page = 'create_invite'; render(); });
          } else {
            state.page = 'premium_result';
            render();
          }
        }, 2000);
      }
    }

    function startPremiumFree() {
      state.isPremium = true;
      state.currentQ = 0;
      state.premiumAnswers = [];
      state.page = 'premium_test';
      render();
    }

    function goPay(t) { saveState(); location.href = LATPEED[t]; }
    function goMyResult() { state.page = state.isPremium ? 'premium_result' : 'free_result'; render(); }
    
    function copyInviteLink(url) {
      navigator.clipboard.writeText(url).then(function() {
        alert('✅ 링크 복사됨!\n\n연인에게 보내세요 💕');
      });
    }

    function shareResult() {
      var a = animals[state.animalCode];
      var t = a.emoji + ' ' + state.nickname + '의 연애 동물: ' + a.name + '\n' + a.slogan + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) navigator.share({ title: '연애 동물 테스트', text: t });
      else { navigator.clipboard.writeText(t); alert('복사됨!'); }
    }

    function shareCompatResult() {
      var me = animals[state.animalCode];
      var them = animals[state.inviterData.animalCode];
      var t = '💕 ' + state.inviterData.nickname + ' × ' + state.nickname + ' 궁합!\n' + them.emoji + ' × ' + me.emoji + '\n\n👉 ' + location.origin + location.pathname;
      if (navigator.share) navigator.share({ title: '커플 궁합', text: t });
      else { navigator.clipboard.writeText(t); alert('복사됨!'); }
    }

    function restart() {
      localStorage.removeItem('love_animal_v4');
      localStorage.removeItem('shared_free');
      state = { page: 'landing', gender: null, nickname: '', currentQ: 0, answers: [], premiumAnswers: [], animalCode: null, psychProfile: null, isPremium: false, isCompatibility: false, sharedForFree: false, inviteCode: null, inviterData: null, myInviteCode: null };
      history.replaceState({}, '', location.pathname);
      render();
    }

    // 초기화
    (async function() {
      if (state.page === 'create_invite' && state.isCompatibility && !state.myInviteCode) {
        await createInvite();
      }
      render();
    })();
  </script>
</body>
</html>
