    function generateCode() {
      var c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = '';
      for (var i = 0; i < 6; i++) r += c[Math.floor(Math.random() * c.length)];
      return r;
    }

    function calculateAnimal(answers) {
      var E=0,I=0,S=0,N=0,T=0,F=0,J=0,P=0;
      var allQ = freeQuestions.concat(premiumQuestions);
      answers.forEach(function(a, i) {
        var q = allQ[i]; if (!q) return;
        if (q.axis === 'EI') a === 'A' ? E++ : I++;
        if (q.axis === 'SN') a === 'A' ? S++ : N++;
        if (q.axis === 'TF') a === 'A' ? T++ : F++;
        if (q.axis === 'JP') a === 'A' ? J++ : P++;
      });
      var typeCode = (E >= I ? 'E' : 'I') + (S >= N ? 'S' : 'N') + (T >= F ? 'T' : 'F') + (J >= P ? 'J' : 'P');
      return typeToAnimal[typeCode] || 'swan';
    }

        }

    }

      return code;

          '<div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-4">' +

          '<div class="text-6xl my-3">' + a.emoji + '</div>' +

          '<p class="text-gray-500 text-sm mt-1">' + a.desc + '</p></div>' +

          (state.isCompatibility ? '' : '<button onclick="goPay(\'compatibility\')" class="w-full py-5 gradient-bg-couple text-white font-bold rounded-2xl shadow-lg mb-4"><p class="text-lg">💕 연인과 궁합도 확인하기</p><p class="text-sm opacity-90">연인은 무료!</p><p class="font-bold mt-1">3,000원</p></button>') +

    // ============================================
    // 이벤트
    // ============================================
    function goGender() { state.page = 'gender'; render(); }
    function selectGender(g) { state.gender = g; state.page = 'nickname'; render(); }

    function startTest() {
      var el = document.getElementById('nameInput');
      if (el && el.value.trim()) {
        state.nickname = el.value.trim();
        state.currentQ = 0;
        state.answers = [];
        state.page = 'free_test';
        render();
      }
    }

    function answer(c) {
      state.answers.push(c);
      if (state.currentQ < 6) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          state.animalCode = calculateAnimal(state.answers);
          saveLocal();
          if (state.inviteCode && state.inviterData) { completeCompat(); state.page = 'compat_result'; }
          else { state.page = 'free_result'; }
          render();
        }, 2000);
      }
    }

    function answerPremium(c) {
      state.premiumAnswers.push(c);
      if (state.currentQ < 13) { state.currentQ++; render(); }
      else {
        state.page = 'loading'; render();
        setTimeout(function() {
          state.answers = state.answers.concat(state.premiumAnswers);
          state.animalCode = calculateAnimal(state.answers);
          saveLocal();
          if (state.isCompatibility) { createInvite().then(function() { state.page = 'create_invite'; render(); }); }
          else { state.page = 'premium_result'; render(); }
        }, 2000);
      }
    }

    function goPay(t) { saveLocal(); location.href = LATPEED[t]; }
    function goMyResult() { state.page = state.isPremium ? 'premium_result' : 'free_result'; render(); }
    function copyLink(u) { try { navigator.clipboard.writeText(u); } catch(e) {} alert('복사됨! 연인에게 보내세요 💕'); }
    
    function shareResult() {
      var a = animals[state.animalCode];
      var t = state.nickname + '의 연애 동물: ' + a.emoji + ' ' + a.name + '\n\n나도 해보기 👉 ' + location.origin + location.pathname;
      if (navigator.share) navigator.share({ title: '연애 동물 테스트', text: t }).catch(function(){});
      else { try { navigator.clipboard.writeText(t); } catch(e) {} alert('복사됨!'); }
    }
    
    function shareCompat() {
      var me = animals[state.animalCode];
      var them = animals[state.inviterData.animalCode];
      var t = '💕 ' + state.inviterData.nickname + ' × ' + state.nickname + ' 궁합 ' + calcScore() + '점!\n' + them.emoji + ' × ' + me.emoji + '\n\n테스트하기 👉 ' + location.origin + location.pathname;
      if (navigator.share) navigator.share({ title: '커플 궁합', text: t }).catch(function(){});
      else { try { navigator.clipboard.writeText(t); } catch(e) {} alert('복사됨!'); }
    }
    
    function restart() {
      localStorage.removeItem('love_animal_v3');
      state = { page: 'landing', gender: null, nickname: '', currentQ: 0, answers: [], premiumAnswers: [], animalCode: null, isPremium: false, isCompatibility: false, inviteCode: null, inviterData: null, myInviteCode: null };
      history.replaceState({}, '', location.pathname);
      render();
    }

    // 초기화
    (async function() {
      if (state.page === 'create_invite' && state.isCompatibility && !state.myInviteCode) await createInvite();
      render();
    })();
